[project]
name = "site-continuity-fleet"
version = "0.2.0"
description = "Secure autonomous multi-agent site continuity fleet for All Things Agentic."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]
adk = ["google-adk>=2.7", "google-genai>=2.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
